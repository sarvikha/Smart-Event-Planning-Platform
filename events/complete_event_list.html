<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completed Events List - Event Registration Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 10px; box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1); }
        header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .btn-group { display: flex; gap: 10px; }
        a { padding: 10px 20px; border-radius: 5px; text-decoration: none; background: white; color: #667eea; transition: all 0.3s ease; }
        a:hover { background: #f0f0f0; }
        .content { padding: 30px; }
        table { width: 100%; border-collapse: collapse; }
        table th { background: #f8f9fa; padding: 15px; text-align: left; font-weight: 600; border-bottom: 2px solid #ddd; }
        table td { padding: 12px 15px; border-bottom: 1px solid #ddd; }
        .footer { padding: 20px 30px; background: #f8f9fa; text-align: center; border-top: 1px solid #ddd; }
        .footer a { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; display: inline-block; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✅ Completed Events List</h1>
            <div class="btn-group">
                <a href="../dashboard.html">← Back to Dashboard</a>
            </div>
        </header>
        
        <div class="content">
            <table>
                <thead>
                    <tr>
                        <th>Event ID</th>
                        <th>Event Name</th>
                        <th>Completion Date</th>
                        <th>Attendees</th>
                        <th>Rating</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>E001</td>
                        <td>Annual Conference 2024</td>
                        <td>2024-12-15</td>
                        <td>250</td>
                        <td>⭐⭐⭐⭐⭐</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="footer">
            <a href="../dashboard.html">🏠 Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
