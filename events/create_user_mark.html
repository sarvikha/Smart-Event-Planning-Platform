<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create User Mark - Event Registration Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 10px; box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1); }
        header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; }
        .content { padding: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 1em; }
        input:focus, select:focus { outline: none; border-color: #667eea; box-shadow: 0 0 10px rgba(102, 126, 234, 0.2); }
        button { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 12px 30px; border: none; border-radius: 5px; cursor: pointer; transition: all 0.3s ease; margin-right: 10px; }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3); }
        a { color: #667eea; text-decoration: none; padding: 10px 20px; display: inline-block; margin-top: 20px; }
        .footer { padding: 20px 30px; background: #f8f9fa; text-align: center; border-top: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⭐ Create User Mark</h1>
        </header>
        
        <div class="content">
            <form>
                <div class="form-group">
                    <label for="user">Select User</label>
                    <select id="user" required>
                        <option>Choose a user...</option>
                        <option>User 001</option>
                        <option>User 002</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="event">Select Event</label>
                    <select id="event" required>
                        <option>Choose an event...</option>
                        <option>Event 001</option>
                        <option>Event 002</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="mark">Mark/Score (0-100)</label>
                    <input type="number" id="mark" min="0" max="100" required placeholder="Enter mark">
                </div>
                
                <div class="form-group">
                    <label for="comments">Comments</label>
                    <input type="text" id="comments" placeholder="Add any comments...">
                </div>
                
                <button type="submit">Create Mark</button>
                <a href="user_mark_list.html">Cancel</a>
            </form>
        </div>
        
        <div class="footer">
            <a href="../dashboard.html">🏠 Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
