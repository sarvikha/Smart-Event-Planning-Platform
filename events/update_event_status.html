<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Event Status - Event Registration Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 10px; box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1); }
        header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; }
        .content { padding: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 1em; }
        input:focus, select:focus { outline: none; border-color: #667eea; box-shadow: 0 0 10px rgba(102, 126, 234, 0.2); }
        .status-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 10px; }
        .status-option { display: flex; align-items: center; }
        .status-option input[type="radio"] { margin-right: 8px; }
        .status-option label { margin: 0; }
        button { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 12px 30px; border: none; border-radius: 5px; cursor: pointer; transition: all 0.3s ease; margin-right: 10px; }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3); }
        a { color: #667eea; text-decoration: none; padding: 10px 20px; display: inline-block; margin-top: 20px; }
        .footer { padding: 20px 30px; background: #f8f9fa; text-align: center; border-top: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Update Event Status</h1>
        </header>
        
        <div class="content">
            <form>
                <div class="form-group">
                    <label for="event">Select Event</label>
                    <select id="event" required>
                        <option>Choose an event...</option>
                        <option>Event 001 - Annual Conference 2024</option>
                        <option>Event 002 - Team Outing</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Event Status</label>
                    <div class="status-options">
                        <div class="status-option">
                            <input type="radio" id="status_planning" name="status" value="Planning" required>
                            <label for="status_planning">Planning</label>
                        </div>
                        <div class="status-option">
                            <input type="radio" id="status_active" name="status" value="Active">
                            <label for="status_active">Active</label>
                        </div>
                        <div class="status-option">
                            <input type="radio" id="status_completed" name="status" value="Completed">
                            <label for="status_completed">Completed</label>
                        </div>
                        <div class="status-option">
                            <input type="radio" id="status_cancelled" name="status" value="Cancelled">
                            <label for="status_cancelled">Cancelled</label>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="notes">Status Notes</label>
                    <input type="text" id="notes" placeholder="Add any notes about the status change...">
                </div>
                
                <button type="submit">Update Status</button>
                <a href="event_list.html">Cancel</a>
            </form>
        </div>
        
        <div class="footer">
            <a href="../dashboard.html">🏠 Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
